<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">展示一个内节点的指针/键数组：p0,k1,p1,k2,p2,k3,p3。p1 指向 underfilled 子节点，p2 指向 sibling 子节点，k2 是它们之间的分隔键，用于 STEAL 或 MERGE。</desc>
