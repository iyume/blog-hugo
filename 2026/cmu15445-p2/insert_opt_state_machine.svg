<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">展示 to_insert_opt 驱动的插入状态机，标注每个状态下 to_insert_opt 的元组内容：INSERTING_LEAF 产生 (new_leaf[0], old, new)，PROPAGATING 持有 (key, left, right)，InsertAndSplit 重新生成 (key, left, right) 并环回 PROPAGATING，其余分支汇入 DONE。</desc>
