<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <style>
    :root { --bg:#ffffff; --fg:#1f2937; --line:#6b7280; --blue:#dbeafe; --blueS:#3b82f6; --amber:#fef3c7; --amberS:#d97706; --green:#dcfce7; --greenS:#16a34a; --red:#fee2e2; --redS:#dc2626; --gray:#f3f4f6; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#111827; --fg:#e5e7eb; --line:#9ca3af; --blue:#1e3a5f; --blueS:#60a5fa; --amber:#4a3a12; --amberS:#fbbf24; --green:#14351f; --greenS:#4ade80; --red:#4c1d1d; --redS:#f87171; --gray:#1f2937; }
    }
    text { fill: var(--fg); font-size: 14px; }
    .t { font-weight: 700; font-size: 15px; }
    .c { text-anchor: middle; }
    .lbl { font-size: 13px; fill: var(--line); }
    .ln { stroke: var(--line); stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .ln0 { stroke: var(--line); stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1000" height="710" fill="var(--bg)"/>

  <!-- Candidate -->
  <rect x="260" y="20" width="440" height="62" rx="10" fill="var(--blue)" stroke="var(--blueS)" stroke-width="1.8"/>
  <text class="c" x="480" y="47">Candidate 向所有其他 peer 发送 RequestVote</text>
  <text class="c" x="480" y="68">并开启 goroutine 异步收集票数</text>

  <path class="ln" d="M480,82 L480,120"/>

  <!-- peer receives -->
  <rect x="330" y="120" width="300" height="50" rx="10" fill="var(--gray)" stroke="var(--line)" stroke-width="1.8"/>
  <text class="c" x="480" y="150">peer 收到 RequestVote，检查 term</text>

  <!-- branch lines -->
  <path class="ln0" d="M480,170 L480,200"/>
  <path class="ln0" d="M160,200 L800,200"/>
  <path class="ln" d="M160,200 L160,230"/>
  <path class="ln" d="M480,200 L480,230"/>
  <path class="ln" d="M800,200 L800,230"/>

  <!-- branch 1 -->
  <rect x="20" y="230" width="280" height="140" rx="10" fill="var(--red)" stroke="var(--redS)" stroke-width="1.8"/>
  <text class="t c" x="160" y="257">term &lt; 已知最高 term</text>
  <text class="c" x="160" y="286">可能是某个失活节点突然恢复</text>
  <text class="c" x="160" y="308">携带最高 term 返回，</text>
  <text class="c" x="160" y="330">不处理该请求</text>

  <!-- branch 2 -->
  <rect x="340" y="230" width="280" height="140" rx="10" fill="var(--amber)" stroke="var(--amberS)" stroke-width="1.8"/>
  <text class="t c" x="480" y="257">term = 已知最高 term</text>
  <text class="c" x="480" y="286">本轮投票未结束，其他 peer 也在拉票</text>
  <text class="c" x="480" y="308">该 term 下尚未投过票 → 投票</text>
  <text class="c" x="480" y="330">已经投过票 → 跳过</text>

  <!-- branch 3 -->
  <rect x="660" y="230" width="280" height="140" rx="10" fill="var(--green)" stroke="var(--greenS)" stroke-width="1.8"/>
  <text class="t c" x="800" y="257">term &gt; 已知最高 term</text>
  <text class="c" x="800" y="286">有人想成为新的 leader</text>
  <text class="c" x="800" y="308">peer 对其投票，并刷新超时器</text>
  <text class="c" x="800" y="330">避免自己再次发起选举</text>

  <!-- merge -->
  <path class="ln0" d="M160,370 L160,400"/>
  <path class="ln0" d="M480,370 L480,400"/>
  <path class="ln0" d="M800,370 L800,400"/>
  <path class="ln0" d="M160,400 L800,400"/>
  <path class="ln" d="M480,400 L480,430"/>

  <!-- collect -->
  <rect x="330" y="430" width="300" height="50" rx="10" fill="var(--blue)" stroke="var(--blueS)" stroke-width="1.8"/>
  <text class="c" x="480" y="460">Candidate 异步采集票数</text>

  <path class="ln" d="M480,480 L480,510"/>

  <!-- decision -->
  <polygon points="480,510 620,560 480,610 340,560" fill="var(--amber)" stroke="var(--amberS)" stroke-width="1.8"/>
  <text class="c" x="480" y="565">票数达到多数派？</text>

  <!-- yes -->
  <path class="ln" d="M480,610 L480,650"/>
  <text class="lbl" x="492" y="636">是</text>
  <rect x="380" y="650" width="200" height="44" rx="10" fill="var(--green)" stroke="var(--greenS)" stroke-width="1.8"/>
  <text class="t c" x="480" y="678">成为 Leader</text>

  <!-- no -->
  <path class="ln" d="M620,560 L680,560"/>
  <text class="lbl" x="638" y="550">否</text>
  <rect x="680" y="525" width="260" height="70" rx="10" fill="var(--red)" stroke="var(--redS)" stroke-width="1.8"/>
  <text class="c" x="810" y="554">持续等待，直到某个</text>
  <text class="c" x="810" y="576">Follower 超时</text>

  <!-- loop back -->
  <path class="ln" d="M940,560 L975,560 L975,51 L700,51"/>
  <text class="lbl" x="962" y="300" transform="rotate(90 962 300)" text-anchor="middle">开始下一次选举</text>
</svg>